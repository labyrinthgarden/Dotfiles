general {
  no_fade_in = false
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

background {
  monitor =
  path = $HOME/Pictures/W/g1.png
  blur_passes = 1
}

label {
  monitor = 
  text = cmd[update:1000] echo -e "$(date +"%H")"
  color = rgba(212,131,203,0.9) 
  shadow_size = 3
  shadow_color = rgb(0,0,0)
  shadow_boost = 1.2
  font_size = 150
  font_family = AlfaSlabOne 
  position = 0, -50
  halign = center
  valign = top
  zindex = 5
}

label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%M")"
  color = rgba(104,116,206,0.9) 
  font_size = 150
  font_family = AlfaSlabOne
  position = 0, -220
  halign = center
  valign = top
  zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = rgba(255, 255, 255, 1)
    #color = rgba(122,131,194,0.9) 
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -10
    halign = center
    valign = center
    zindex = 5
}

input-field {
  monitor = 
  size = 250, 60
  outline_thickness = 0
  dots_size = 0.1
  dots_spacing = 1
  dots_center = true
  inner_color = rgba(104,116,206,0)
  placeholder_text =
  check_color = rgba(0,0,0,0.2)
  check_text =
  fail_color = rgba(255,0,0,0.4)
  fail_text = 
  font_color = rgba(200, 200, 200, 0.8)
  fade_on_empty = true
  hide_input = false
  position = 0, -130
  halign = center
  valign = center
  zindex = 20
}

label {
  monitor =
  text = cmd[update:60000] echo "Welcome $USER"  
  color = rgba(255,255,255,0.9)
  font_size = 17
  font_family = JetBrains Mono Nerd Font Mono
  position = 0, -280
  halign = center
  valign = center
}
